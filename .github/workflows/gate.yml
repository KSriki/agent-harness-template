# Layer 3 — the gate nothing talks its way past.
# Runs the SAME .claude/gate.sh the local hooks run: one definition of done.
# Branch protection on main requiring the `gate` check is what makes
# "PRs do not merge on red" physics — enable it in repo settings.
name: gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This repo is stdlib-only; the gate's tools are the only installs.
      # Pinned to the versions the local gate runs — unpinned ruff drifted
      # ahead of local and failed CI on rules the local gate never saw.
      - run: pip install ruff==0.9.2 pytest==9.1.1 pytest-cov==7.1.0

      - name: Run the gate (same script the local hooks run)
        run: ./.claude/gate.sh full
